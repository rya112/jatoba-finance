# Rascunho do formato de perfil de banco. Será definido na fase 2.
id: banco-exemplo
nome: Banco Exemplo
formatos: [ofx]

limpeza:
  remover_prefixos:
    - "COMPRA CARTAO DEBITO "
    - "PIX ENVIADO "
    - "PIX RECEBIDO "
    - "DEB AUTOMATICO "
  remover_regex:
    - "\\s+SAO PAULO$"

naturezas:
  - padrao: "^PAGAMENTO FATURA"
    natureza: pagamento_fatura
  - padrao: "^PAGAMENTO RECEBIDO$"
    natureza: pagamento_fatura
  - padrao: "^APLICACAO"
    natureza: aporte

parcelas:
  padrao: "PARC (\\d{2})/(\\d{2})$"
